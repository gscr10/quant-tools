name: Final gates

on:
  push:
    branches:
      - master
      - task/p1-final-gates
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      provider_duration_seconds:
        description: 'Optional real-provider soak duration (seconds); 0 uses the normal 10-round check'
        required: false
        default: '0'

permissions:
  contents: read

# A push can arrive while a full three-browser gate is still running.  Keep
# only the newest run for this branch so stale runners cannot consume the
# entire queue and hide the result for the current commit.
concurrency:
  group: final-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-gates:
    runs-on: ubuntu-latest
    # The full cross-browser/a11y suite installs three browser engines and
    # intentionally exercises cold-start, touch and visual gates.  Keep the
    # job bounded, but leave enough room for a busy hosted runner instead of
    # turning a slow install into a false Final Gate failure.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install Python Playwright for Python E2E gates
        run: python3 -m pip install --disable-pip-version-check playwright
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: python3 -m playwright install chromium firefox webkit
      # Keep the same aggregate command semantics, but expose each phase as a
      # separate step.  A single opaque shell step can appear frozen for many
      # minutes on a hosted runner while a browser or dependency subprocess is
      # still alive; named steps make the failing phase and its timeout clear.
      - name: Verify startup and repository gates
        run: npm run verify:startup
      - name: Verify complex matching and Bar Magnifier
        run: npm run test:pinets:matching
      - name: Verify local strategy golden
        run: npm run test:pinets:golden
      - name: Verify development workspace regression
        run: npm run test:e2e
      - name: Verify production workspace regression
        run: python3 tests/e2e_app.py --preview
      - name: Verify deployment smoke failure detection locally
        run: npm run test:e2e:deployment:contract
      - name: Verify touch matrix
        run: npm run test:e2e:touch
      - name: Verify visual and accessibility gates
        env:
          QUANT_VISUAL_STRICT_PIXELS: '0'
          QUANT_VISUAL_GEOMETRY_TOLERANCE: '24'
        # Keep a lost browser/Vite child from occupying the hosted runner
        # until the 60-minute job timeout. The Python gate has per-page
        # readiness timeouts; this is the outer process-level safety net.
        run: timeout --signal=TERM --kill-after=30s 15m npm run test:visual:a11y

  deployment-smoke:
    if: ${{ vars.QUANT_DEPLOY_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install Python Playwright for deployment smoke
        run: python3 -m pip install --disable-pip-version-check playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m playwright install chromium
      - name: Check deployed candidate and optional rollback slot
        env:
          QUANT_DEPLOY_URL: ${{ vars.QUANT_DEPLOY_URL }}
          QUANT_PREVIOUS_URL: ${{ vars.QUANT_PREVIOUS_URL }}
        run: npm run test:e2e:deployment

  deployment-not-configured:
    if: ${{ vars.QUANT_DEPLOY_URL == '' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'QUANT_DEPLOY_URL is not configured; real deployment Final Gate remains not_run.'

  provider-soak:
    # Real exchanges are intentionally opt-in: transient upstream outages must
    # not make ordinary pull requests red, while a maintainer can still run the
    # same ten-round soak on a clean GitHub runner when collecting evidence.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build local fork artifacts for provider harness
        run: npm run build:forks
      - name: Install Python Playwright for provider smoke
        run: python3 -m pip install --disable-pip-version-check playwright
      - run: python3 -m playwright install --with-deps chromium
      - name: Run real-provider soak
        env:
          QUANT_PROVIDER_SMOKE_DURATION_SECONDS: ${{ inputs.provider_duration_seconds || '0' }}
        run: |
          args=(--rounds 10 --recovery --output-dir audit-evidence/ci-provider-soak)
          if [[ "$QUANT_PROVIDER_SMOKE_DURATION_SECONDS" != "0" ]]; then
            args+=(--require-websocket)
          fi
          python3 tests/provider_smoke.py "${args[@]}"
      - name: Preserve provider heartbeat and terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-soak-${{ github.run_id }}
          path: audit-evidence/ci-provider-soak/
          if-no-files-found: ignore
          retention-days: 7

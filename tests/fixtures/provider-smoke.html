<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Quant Tools Provider Smoke</title>
  </head>
  <body>
    <script type="module">
      import { createWorkspaceProviders } from '/src/integrations/vela/provider-registry.ts';

      const TIMEOUT_MS = 30_000;
      // Public exchange endpoints occasionally fail before a browser has
      // finished establishing its first network path (for example a transient
      // `TypeError: Failed to fetch` from the hosted runner).  Keep the soak
      // strict about the eventual response, but retry a fresh provider round
      // a small, bounded number of times so one transport blip does not turn
      // an otherwise healthy real-network gate red.
      const ROUND_RETRY_ATTEMPTS = 3;
      const ROUND_RETRY_DELAYS_MS = [750, 1_500];
      // A soak is evidence of a live lease, not merely proof that subscribe()
      // returned a function.  Keep these limits bounded so a silent socket
      // cannot be reported as healthy forever.
      const SOAK_POLL_MS = 250;
      const SOAK_FIRST_CALLBACK_TIMEOUT_MS = 20_000;
      const SOAK_MAX_CALLBACK_GAP_MS = 20_000;

      class SoakContinuityError extends Error {
        constructor(message) {
          super(message);
          this.name = 'SoakContinuityError';
          // Transport/setup failures may use the bounded round retry.  Once a
          // subscription was established, a continuity failure is conclusive;
          // retrying it would hide the failed continuous attempt.
          this.retryable = false;
        }
      }

      function assertBar(bar, label) {
        if (!Number.isFinite(bar?.time)) throw new Error(`${label}: invalid time`);
        for (const field of ['open', 'high', 'low', 'close']) {
          if (!Number.isFinite(bar?.[field])) throw new Error(`${label}: invalid ${field}`);
        }
        if (bar.high < bar.low) throw new Error(`${label}: high is below low`);
      }

      async function withTimeout(promise, label) {
        let timer;
        try {
          return await Promise.race([
            promise,
            new Promise((_, reject) => {
              timer = setTimeout(() => reject(new Error(`${label} timed out`)), TIMEOUT_MS);
            }),
          ]);
        } finally {
          clearTimeout(timer);
        }
      }

      async function withRoundRetry(operation, label) {
        let lastError;
        for (let attempt = 0; attempt < ROUND_RETRY_ATTEMPTS; attempt += 1) {
          try {
            return await operation(attempt);
          } catch (error) {
            lastError = error;
            if (error?.retryable === false) break;
            if (attempt + 1 >= ROUND_RETRY_ATTEMPTS) break;
            await new Promise(resolve => setTimeout(resolve, ROUND_RETRY_DELAYS_MS[attempt] ?? 1_500));
          }
        }
        throw new Error(`${label} failed after ${ROUND_RETRY_ATTEMPTS} attempts: ${String(lastError?.message ?? lastError)}`);
      }

      async function verifyHistory(provider, symbol, timeframe, label) {
        const bars = await withTimeout(
          provider.getBars(symbol, timeframe, { limit: 5 }),
          `${label} history`,
        );
        if (bars.length < 2) throw new Error(`${label}: expected historical bars`);
        bars.forEach((bar) => assertBar(bar, `${label} history`));
        return bars.length;
      }

      async function verifyLive(provider, symbol, timeframe, label) {
        await withTimeout(new Promise((resolve, reject) => {
          let settled = false;
          let unsubscribe = () => {};
          const finish = (error) => {
            if (settled) return;
            settled = true;
            unsubscribe();
            if (error) reject(error);
            else resolve();
          };
          try {
            unsubscribe = provider.subscribe(symbol, timeframe, (bar) => {
              try {
                assertBar(bar, `${label} live`);
                finish();
              } catch (error) {
                finish(error);
              }
            });
          } catch (error) {
            finish(error);
          }
        }), `${label} live update`);
      }

      async function verifyFuturesInfo(provider, symbol, label) {
        // Exchange metadata can be cold or briefly served from the spot
        // endpoint while the futures route is warming. Retry only the
        // metadata classification; history and live assertions remain strict.
        let lastType;
        for (let attempt = 0; attempt < 3; attempt += 1) {
          const info = await withTimeout(
            provider.getSymbolInfo(symbol),
            `${label} symbol info`,
          );
          lastType = info?.type;
          if (lastType === 'futures') return info;
          if (attempt < 2) await new Promise(resolve => setTimeout(resolve, 500 * (attempt + 1)));
        }
        throw new Error(`${label} symbol did not resolve as futures (last type: ${String(lastType)})`);
      }

      async function probeFuturesInfo(provider, symbol, label) {
        try {
          const info = await withTimeout(provider.getSymbolInfo(symbol), `${label} symbol info`);
          if (info != null && info.type !== 'futures') {
            throw new Error(`${label} symbol resolved with unexpected type: ${String(info.type)}`);
          }
          return info?.type ?? 'unavailable';
        } catch (error) {
          // Futures exchangeInfo is independent from the kline/live routes.
          // Preserve the status in the soak result without misclassifying a
          // metadata outage as a WebSocket failure.
          return `unavailable: ${String(error?.message ?? error)}`;
        }
      }

      async function runProviderSmokeRound() {
        const providers = createWorkspaceProviders();
        const binance = providers.binance();
        const hyperliquid = providers.hyperliquid();
        const [binanceBars, binanceFuturesBars, hyperliquidBars] = await Promise.all([
          verifyHistory(binance, 'BTCUSDT', '15', 'Binance spot 15m'),
          verifyHistory(binance, 'BTCUSDT.P', '60', 'Binance futures 1h'),
          verifyHistory(hyperliquid, 'BTC', '15', 'Hyperliquid 15m'),
        ]);
        await verifyFuturesInfo(binance, 'BTCUSDT.P', 'Binance futures');
        await Promise.all([
          verifyLive(binance, 'BTCUSDT', '15', 'Binance spot 15m'),
          verifyLive(hyperliquid, 'BTC', '15', 'Hyperliquid 15m'),
        ]);
        return {
          binance: { historyBars: binanceBars, live: true },
          binanceFutures: { historyBars: binanceFuturesBars, timeframe: '60', symbol: 'BTCUSDT.P' },
          hyperliquid: { historyBars: hyperliquidBars, live: true },
        };
      }

      window.runProviderSmoke = async (rounds = 1) => {
        const count = Number.isInteger(rounds) && rounds > 0 ? rounds : 1;
        let result;
        for (let round = 0; round < count; round += 1) {
          // Create providers inside each attempt.  Vela memoizes rejected
          // REST promises on an instance, so retrying the same objects would
          // simply replay the first failure instead of testing recovery.
          result = await withRoundRetry(
            () => runProviderSmokeRound(),
            `provider smoke round ${round + 1}`,
          );
        }
        return { ...result, roundsCompleted: count };
      };

      // Keep both live subscriptions in one browser/page for duration-based
      // soak runs. Recreating the page for every round only proves that a
      // fresh socket can open; it does not exercise the lease across a long
      // lived connection (or expose a late callback after the page remains
      // mounted).
      async function runProviderSoakAttempt(durationMs = 60_000) {
        const duration = Number.isFinite(durationMs) && durationMs > 0
          ? durationMs
          : 60_000;
        const providers = createWorkspaceProviders();
        const states = [
          { name: 'binance', provider: providers.binance(), symbol: 'BTCUSDT', bars: [], error: null, firstLiveAt: null, lastLiveAt: null, maxGapMs: 0 },
          { name: 'hyperliquid', provider: providers.hyperliquid(), symbol: 'BTC', bars: [], error: null, firstLiveAt: null, lastLiveAt: null, maxGapMs: 0 },
        ];
        let active = true;
        const unsubscriptions = new Set();
        const addSubscription = (unsubscribe) => {
          if (typeof unsubscribe !== 'function') return;
          if (!active) {
            try { unsubscribe(); } catch { /* teardown is best effort */ }
            return;
          }
          unsubscriptions.add(unsubscribe);
        };
        const cleanup = () => {
          active = false;
          for (const unsubscribe of unsubscriptions) {
            try { unsubscribe?.(); } catch { /* teardown is best effort */ }
          }
          unsubscriptions.clear();
        };
        try {
          await Promise.all(states.map(async state => {
            const history = await verifyHistory(state.provider, state.symbol, '15', `${state.name} soak`);
            if (!active) return;
            state.historyBars = history;
            const callback = bar => {
              try {
                assertBar(bar, `${state.name} soak live`);
                const now = Date.now();
                if (state.lastLiveAt !== null) {
                  state.maxGapMs = Math.max(state.maxGapMs, now - state.lastLiveAt);
                }
                state.firstLiveAt ??= now;
                state.lastLiveAt = now;
                state.bars.push({ time: bar.time, close: bar.close });
              } catch (error) {
                state.error = new SoakContinuityError(String(error?.message ?? error));
              }
            };
            const unsubscribe = state.provider.subscribe(state.symbol, '15', callback);
            addSubscription(unsubscribe);
          }));
          if (!active) throw new Error('provider soak setup was superseded');
          const futuresMetadata = await probeFuturesInfo(
            providers.binance(),
            'BTCUSDT.P',
            'Binance futures soak',
          );
          const futuresBars = await verifyHistory(
            providers.binance(),
            'BTCUSDT.P',
            '60',
            'Binance futures soak',
          );
          const startedAt = Date.now();
          while (Date.now() - startedAt < duration) {
            await new Promise(resolve => setTimeout(resolve, Math.min(SOAK_POLL_MS, duration)));
            const elapsed = Date.now() - startedAt;
            for (const state of states) {
              if (state.error) throw state.error;
              if (state.firstLiveAt === null && elapsed >= Math.min(duration, SOAK_FIRST_CALLBACK_TIMEOUT_MS)) {
                throw new SoakContinuityError(`${state.name} soak produced no live callbacks`);
              }
              if (state.lastLiveAt !== null && Date.now() - state.lastLiveAt > SOAK_MAX_CALLBACK_GAP_MS) {
                throw new SoakContinuityError(`${state.name} soak live callback gap exceeded ${SOAK_MAX_CALLBACK_GAP_MS}ms`);
              }
            }
          }
          for (const state of states) {
            if (state.error) throw state.error;
            if (state.bars.length === 0) {
              throw new SoakContinuityError(`${state.name} soak produced no live callbacks`);
            }
            if (state.lastLiveAt === null || Date.now() - state.lastLiveAt > SOAK_MAX_CALLBACK_GAP_MS) {
              throw new SoakContinuityError(`${state.name} soak ended without fresh live evidence`);
            }
          }
          const subscriptions = Object.fromEntries(states.map(state => [state.name, {
            historyBars: state.historyBars,
            liveCallbacks: state.bars.length,
            firstLiveAt: state.firstLiveAt,
            lastLiveAt: state.lastLiveAt,
            maxGapMs: state.maxGapMs,
          }]));
          return {
            durationMs: duration,
            subscriptions,
            futuresMetadata,
            // Keep the same route keys as the short smoke contract so the
            // command-line gate validates both modes uniformly.
            binance: { historyBars: subscriptions.binance.historyBars, live: true },
            binanceFutures: { historyBars: futuresBars, timeframe: '60', symbol: 'BTCUSDT.P' },
            hyperliquid: { historyBars: subscriptions.hyperliquid.historyBars, live: true },
          };
        } finally {
          cleanup();
        }
      }

      window.runProviderSoak = async (durationMs = 60_000) => withRoundRetry(
        () => runProviderSoakAttempt(durationMs),
        'provider soak',
      );

      // This is intentionally separate from the short smoke above.  The
      // caller toggles the real browser network state between the two polls;
      // the provider wrapper must tear down the old lease and deliver a bar
      // from the resumed subscription.  Keeping the subscription alive here
      // also makes this useful for a longer, manually-triggered soak without
      // making ordinary pull requests depend on a public exchange's timing.
      let recoveryState;
      window.beginProviderRecovery = (providerName = 'hyperliquid') => {
        if (recoveryState?.unsubscribe) recoveryState.unsubscribe();
        const provider = createWorkspaceProviders()[providerName];
        if (typeof provider !== 'function') throw new Error(`unknown provider: ${providerName}`);
        const instance = provider();
        const state = { bars: [], error: null, unsubscribe: null };
        state.unsubscribe = instance.subscribe(
          providerName === 'binance' ? 'BTCUSDT' : 'BTC',
          '15',
          bar => state.bars.push({ time: bar.time, close: bar.close }),
        );
        recoveryState = state;
        return true;
      };
      window.providerRecoveryState = () => {
        if (!recoveryState) return { bars: [], error: null };
        return { bars: recoveryState.bars.slice(), error: recoveryState.error };
      };
      window.endProviderRecovery = () => {
        recoveryState?.unsubscribe?.();
        recoveryState = undefined;
      };
      window.providerSmokeReady = true;
    </script>
  </body>
</html>

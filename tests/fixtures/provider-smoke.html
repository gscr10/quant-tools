<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Quant Tools Provider Smoke</title>
  </head>
  <body>
    <script type="module">
      import { createWorkspaceProviders } from '/src/integrations/vela/provider-registry.ts';

      const TIMEOUT_MS = 30_000;

      function assertBar(bar, label) {
        if (!Number.isFinite(bar?.time)) throw new Error(`${label}: invalid time`);
        for (const field of ['open', 'high', 'low', 'close']) {
          if (!Number.isFinite(bar?.[field])) throw new Error(`${label}: invalid ${field}`);
        }
        if (bar.high < bar.low) throw new Error(`${label}: high is below low`);
      }

      async function withTimeout(promise, label) {
        let timer;
        try {
          return await Promise.race([
            promise,
            new Promise((_, reject) => {
              timer = setTimeout(() => reject(new Error(`${label} timed out`)), TIMEOUT_MS);
            }),
          ]);
        } finally {
          clearTimeout(timer);
        }
      }

      async function verifyHistory(provider, symbol, timeframe, label) {
        const bars = await withTimeout(
          provider.getBars(symbol, timeframe, { limit: 5 }),
          `${label} history`,
        );
        if (bars.length < 2) throw new Error(`${label}: expected historical bars`);
        bars.forEach((bar) => assertBar(bar, `${label} history`));
        return bars.length;
      }

      async function verifyLive(provider, symbol, timeframe, label) {
        await withTimeout(new Promise((resolve, reject) => {
          let settled = false;
          let unsubscribe = () => {};
          const finish = (error) => {
            if (settled) return;
            settled = true;
            unsubscribe();
            if (error) reject(error);
            else resolve();
          };
          try {
            unsubscribe = provider.subscribe(symbol, timeframe, (bar) => {
              try {
                assertBar(bar, `${label} live`);
                finish();
              } catch (error) {
                finish(error);
              }
            });
          } catch (error) {
            finish(error);
          }
        }), `${label} live update`);
      }

      async function runProviderSmokeRound() {
        const providers = createWorkspaceProviders();
        const binance = providers.binance();
        const hyperliquid = providers.hyperliquid();
        const [binanceBars, binanceFuturesBars, hyperliquidBars, futuresInfo] = await Promise.all([
          verifyHistory(binance, 'BTCUSDT', '15', 'Binance spot 15m'),
          verifyHistory(binance, 'BTCUSDT.P', '60', 'Binance futures 1h'),
          verifyHistory(hyperliquid, 'BTC', '15', 'Hyperliquid 15m'),
          withTimeout(binance.getSymbolInfo('BTCUSDT.P'), 'Binance futures symbol info'),
        ]);
        if (futuresInfo?.type !== 'futures') throw new Error('Binance futures symbol did not resolve as futures');
        await Promise.all([
          verifyLive(binance, 'BTCUSDT', '15', 'Binance spot 15m'),
          verifyLive(hyperliquid, 'BTC', '15', 'Hyperliquid 15m'),
        ]);
        return {
          binance: { historyBars: binanceBars, live: true },
          binanceFutures: { historyBars: binanceFuturesBars, timeframe: '60', symbol: 'BTCUSDT.P' },
          hyperliquid: { historyBars: hyperliquidBars, live: true },
        };
      }

      window.runProviderSmoke = async (rounds = 1) => {
        const count = Number.isInteger(rounds) && rounds > 0 ? rounds : 1;
        let result;
        for (let round = 0; round < count; round += 1) result = await runProviderSmokeRound();
        return { ...result, roundsCompleted: count };
      };

      // This is intentionally separate from the short smoke above.  The
      // caller toggles the real browser network state between the two polls;
      // the provider wrapper must tear down the old lease and deliver a bar
      // from the resumed subscription.  Keeping the subscription alive here
      // also makes this useful for a longer, manually-triggered soak without
      // making ordinary pull requests depend on a public exchange's timing.
      let recoveryState;
      window.beginProviderRecovery = (providerName = 'hyperliquid') => {
        if (recoveryState?.unsubscribe) recoveryState.unsubscribe();
        const provider = createWorkspaceProviders()[providerName];
        if (typeof provider !== 'function') throw new Error(`unknown provider: ${providerName}`);
        const instance = provider();
        const state = { bars: [], error: null, unsubscribe: null };
        state.unsubscribe = instance.subscribe(
          providerName === 'binance' ? 'BTCUSDT' : 'BTC',
          '15',
          bar => state.bars.push({ time: bar.time, close: bar.close }),
        );
        recoveryState = state;
        return true;
      };
      window.providerRecoveryState = () => {
        if (!recoveryState) return { bars: [], error: null };
        return { bars: recoveryState.bars.slice(), error: recoveryState.error };
      };
      window.endProviderRecovery = () => {
        recoveryState?.unsubscribe?.();
        recoveryState = undefined;
      };
      window.providerSmokeReady = true;
    </script>
  </body>
</html>
